<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a26"/>
      <stop offset="50%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Outer Squircle Rim Glow -->
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Shutter Iris Ring -->
    <linearGradient id="irisRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Central 4-Cut Tiles Glow -->
    <filter id="tileGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="lensCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="70%" stop-color="#0c0d18"/>
      <stop offset="100%" stop-color="#030408"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#rimGlow)" stroke-width="2.5" opacity="0.9"/>

  <!-- Lens Outer Housing -->
  <circle cx="64" cy="64" r="46" fill="url(#lensCenter)"/>
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#irisRing)" stroke-width="3" opacity="0.95"/>
  <circle cx="64" cy="64" r="42" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.4"/>

  <!-- Camera Shutter Blades (6-segment iris) -->
  <g stroke="url(#irisRing)" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M64 22 C73 34, 78 48, 77 64"/>
    <path d="M100.4 43 C91 54, 79 63, 64 69"/>
    <path d="M100.4 85 C85 86, 71 80, 59 70"/>
    <path d="M64 106 C55 94, 50 80, 51 64"/>
    <path d="M27.6 85 C37 74, 49 65, 64 59"/>
    <path d="M27.6 43 C43 42, 57 48, 69 58"/>
  </g>

  <!-- Central 4-Cut Frame Photo Tiles (2x2 Grid) -->
  <g filter="url(#tileGlow)">
    <rect x="49" y="49" width="11.5" height="11.5" rx="2.5" fill="#ffffff" stroke="url(#rimGlow)" stroke-width="1.2"/>
    <rect x="67.5" y="49" width="11.5" height="11.5" rx="2.5" fill="#ffffff" stroke="url(#rimGlow)" stroke-width="1.2"/>
    <rect x="49" y="67.5" width="11.5" height="11.5" rx="2.5" fill="#ffffff" stroke="url(#rimGlow)" stroke-width="1.2"/>
    <rect x="67.5" y="67.5" width="11.5" height="11.5" rx="2.5" fill="#ffffff" stroke="url(#rimGlow)" stroke-width="1.2"/>
  </g>

  <!-- Star Flash / Sparkle Highlight on Aperture -->
  <g transform="translate(86, 36)">
    <path d="M0 -12 Q0 0 12 0 Q0 0 0 12 Q0 0 -12 0 Q0 0 0 -12 Z" fill="#ffffff"/>
    <circle cx="0" cy="0" r="2.5" fill="#e0e7ff"/>
  </g>

  <!-- Secondary subtle sparkle -->
  <g transform="translate(38, 88) scale(0.55)">
    <path d="M0 -10 Q0 0 10 0 Q0 0 0 10 Q0 0 -10 0 Q0 0 0 -10 Z" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Glass Specular Curved Highlight -->
  <path d="M26 44 C34 28, 54 20, 78 21 C89 21.5, 96 25, 102 30 C88 27, 50 32, 34 52 C29 49, 27 46, 26 44 Z" fill="#ffffff" opacity="0.18"/>
</svg>
